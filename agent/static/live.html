<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>即時字幕</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    background: rgba(20, 22, 26, 0.88);
    color: #fff;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 12px 16px;
    overflow: hidden;
  }
  #topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    flex: 0 0 auto;
  }
  #dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #9aa0a6;
  }
  #dot.on { background: #34a853; animation: blink 1.5s infinite; }
  #dot.err { background: #ea4335; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
  #stateText { font-size: 13px; color: #bdc1c6; }
  #stopBtn {
    margin-left: auto;
    font-size: 13px;
    padding: 4px 14px;
    border: none;
    border-radius: 14px;
    background: #5f6368;
    color: #fff;
    cursor: pointer;
  }
  #stopBtn:hover { background: #757a7f; }
  #captions {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: scroll;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #captions::-webkit-scrollbar { width: 8px; }
  #captions::-webkit-scrollbar-thumb {
    background: #5f6368;
    border-radius: 4px;
  }
  #captions::-webkit-scrollbar-thumb:hover { background: #80868b; }
  #captions::-webkit-scrollbar-track { background: rgba(255,255,255,.06); border-radius: 4px; }
  .line { border-left: 3px solid #1a73e8; padding-left: 10px; }
  .line .transcript {
    font-size: 12px;
    color: #9aa0a6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .line .translation {
    font-size: 20px;
    font-weight: 600;
    line-height: 1.45;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .line .meta { font-size: 11px; color: #80868b; margin-top: 2px; }
  #hint { font-size: 14px; color: #9aa0a6; }
</style>
</head>
<body>
<div id="topbar">
  <span id="dot"></span>
  <span id="stateText">啟動中…</span>
  <button id="stopBtn">停止並關閉</button>
</div>
<div id="captions"><div id="hint">正在擷取電腦的系統聲音，偵測到說話時會自動翻譯成字幕（每 4–8 秒一段）。</div></div>

<script>
const $ = id => document.getElementById(id);
let lastSeq = 0;

function setState(text, cls) {
  $("stateText").textContent = text;
  $("dot").className = cls || "";
}

async function poll() {
  try {
    const resp = await fetch("/live/status");
    const data = await resp.json();
    if (!data.running && data.error) {
      setState("擷取失敗：" + data.error, "err");
      return;
    }
    if (!data.running) {
      setState("已停止", "");
      return;
    }
    setState("擷取中 — 播放英文聲音即可（Teams / YT）", "on");
    const captions = data.captions || [];
    const fresh = captions.filter(c => c.seq > lastSeq);
    if (!fresh.length) return;
    lastSeq = captions[captions.length - 1].seq;
    const hint = $("hint");
    if (hint) hint.remove();
    const box = $("captions");
    const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
    for (const c of fresh) {
      const line = document.createElement("div");
      line.className = "line";
      const transcript = document.createElement("div");
      transcript.className = "transcript";
      transcript.textContent = c.transcript;
      const translation = document.createElement("div");
      translation.className = "translation";
      translation.textContent = c.translated_text;
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = `${c.time} · ${c.source} · ${c.model}`;
      line.append(transcript, translation, meta);
      box.appendChild(line);
    }
    // Keep every caption until the window is closed; the scrollbar handles history.
    if (nearBottom) box.scrollTop = box.scrollHeight;
  } catch (err) {
    setState("無法連線到後端", "err");
  }
}

$("stopBtn").addEventListener("click", async () => {
  try { await fetch("/live/stop", { method: "POST" }); } catch (e) {}
  window.close();
});

fetch("/live/start", { method: "POST" })
  .then(r => r.json())
  .then(() => setState("擷取中 — 播放英文聲音即可（Teams / YT）", "on"))
  .catch(() => setState("無法啟動即時字幕", "err"));

setInterval(poll, 1000);
poll();
</script>
</body>
</html>
